[project]
name = "imagegen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0,<12"]

[project.scripts]
imagegen = "imagegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
